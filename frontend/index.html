<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔒 AI 서버사이드 프라이버시 문서 마스킹 스캐너</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4">

    <header class="w-full max-w-2xl text-center py-4">
        <h1 class="text-2xl md:text-3xl font-bold bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent">
            🔒 하이브리드 서버사이드 문서 마스킹
        </h1>
        <p class="text-xs md:text-sm text-slate-400 mt-1">
            FastAPI + Tesseract OCR 백엔드 연동 • 등본·계약서·신분증 완벽 대응
        </p>
    </header>

    <main class="w-full max-w-2xl bg-slate-800/95 backdrop-blur rounded-2xl shadow-2xl border border-slate-700 p-5 flex flex-col items-center space-y-4">
        
        <!-- Backend API URL Setting -->
        <div class="w-full bg-slate-900/80 p-3 rounded-xl border border-slate-700 flex flex-col gap-2 text-xs">
            <label class="text-slate-300 font-semibold">🔗 백엔드 API 서버 주소 (Render 등):</label>
            <input type="text" id="backend-url" value="https://your-backend-service.onrender.com" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-indigo-500">
        </div>

        <!-- Status Box -->
        <div id="status-box" class="w-full bg-slate-900 border border-slate-700 text-slate-300 px-4 py-2.5 rounded-xl text-xs md:text-sm text-center font-medium">
            📂 문서를 업로드하고 서버 마스킹을 시작하세요.
        </div>

        <!-- Controls -->
        <div class="w-full bg-slate-900/80 p-3 rounded-xl border border-slate-700 flex items-center justify-between text-xs">
            <div class="flex items-center gap-2">
                <span class="text-slate-300 font-semibold">주민번호 마스킹 옵션:</span>
                <label class="inline-flex items-center cursor-pointer text-slate-300">
                    <input type="radio" name="mask-mode" value="full" checked class="form-radio text-indigo-500">
                    <span class="ml-1">전체 가리기</span>
                </label>
                <label class="inline-flex items-center cursor-pointer text-slate-300 ml-2">
                    <input type="radio" name="mask-mode" value="back" class="form-radio text-indigo-500">
                    <span class="ml-1">뒷자리만 가리기</span>
                </label>
            </div>
            <button id="btn-process" class="bg-indigo-600 hover:bg-indigo-500 text-white py-2 px-4 rounded-lg font-medium transition" disabled>
                🚀 서버 정밀 마스킹 실행
            </button>
        </div>

        <!-- File Upload -->
        <div class="w-full">
            <label class="flex flex-col items-center justify-center w-full h-28 border-2 border-slate-600 border-dashed rounded-xl cursor-pointer bg-slate-900/50 hover:bg-slate-900 transition">
                <div class="flex flex-col items-center justify-center pt-4 pb-4">
                    <p class="text-xs md:text-sm text-slate-300 font-medium">문서 이미지 파일 선택 (JPG, PNG)</p>
                    <p class="text-[11px] text-slate-500 mt-0.5">클릭하여 업로드</p>
                </div>
                <input id="file-input" type="file" accept="image/*" class="hidden" />
            </label>
        </div>

        <!-- Preview Area -->
        <div class="w-full flex flex-col items-center relative">
            <div class="w-full bg-slate-950 rounded-xl overflow-hidden flex items-center justify-center min-h-[300px] border border-slate-800 relative">
                <img id="preview-img" class="max-w-full h-auto object-contain hidden" alt="Masked Result" />
                <div id="placeholder-text" class="absolute text-slate-500 text-xs md:text-sm">
                    결과 미리보기가 여기에 표시됩니다.
                </div>
            </div>
        </div>

        <!-- Download Button -->
        <a id="download-btn" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 text-white font-semibold py-3 rounded-xl transition text-center hidden">
            💾 마스킹 완료된 문서 다운로드
        </a>
    </main>

    <footer class="w-full max-w-2xl text-center py-3 text-[11px] text-slate-500">
        Hybrid Cloudflare Pages + Python FastAPI Backend
    </footer>

    <script>
        let selectedFile = null;
        const fileInput = document.getElementById('file-input');
        const statusBox = document.getElementById('status-box');
        const btnProcess = document.getElementById('btn-process');
        const previewImg = document.getElementById('preview-img');
        const placeholderText = document.getElementById('placeholder-text');
        const downloadBtn = document.getElementById('download-btn');

        fileInput.addEventListener('change', (e) => {
            fileInput.files[0];
            if (e.target.files && e.target.files[0]) {
                selectedFile = e.target.files[0];
                statusBox.textContent = `✅ 파일 선택됨: ${selectedFile.name}`;
                btnProcess.removeAttribute('disabled');
                
                // Show raw preview temporarily
                const reader = new FileReader();
                reader.onload = (ev) => {
                    previewImg.src = ev.target.result;
                    previewImg.classList.remove('hidden');
                    placeholderText.style.display = 'none';
                };
                reader.readAsDataURL(selectedFile);
            }
        });

        btnProcess.addEventListener('click', async () => {
            if (!selectedFile) return;

            const backendUrl = document.getElementById('backend-url').value.trim();
            const maskMode = document.querySelector('input[name="mask-mode"]:checked').value;

            statusBox.textContent = "⏳ 서버에서 AI OCR 분석 및 마스킹 처리 중입니다... (약 5~10초 소요)";
            btnProcess.setAttribute('disabled', 'true');

            const formData = new FormData();
            formData.append('file', selectedFile);
            formData.append('mask_mode', maskMode);

            try {
                const response = await fetch(`${backendUrl}/api/mask`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.status === 'success') {
                    statusBox.textContent = `✅ 마스킹 완료! (총 민감정보 ${data.detected_count}건 감지 및 처리)`;
                    previewImg.src = data.masked_image_base64;
                    downloadBtn.href = data.masked_image_base64;
                    downloadBtn.download = `masked_${selectedFile.name}`;
                    downloadBtn.classList.remove('hidden');
                } else {
                    statusBox.textContent = `⚠️ 오류 발생: ${data.message}`;
                }
            } catch (err) {
                console.error(err);
                statusBox.textContent = "⚠️ 서버 통신 실패. 백엔드 주소나 서버 상태를 확인하세요.";
            } finally {
                btnProcess.removeAttribute('disabled');
            }
        });
    </script>
</body>
</html>
